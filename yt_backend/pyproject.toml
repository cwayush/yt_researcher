[project]
name = "yt-backend"
version = "0.1.0"
description = "YouTube Video RAG backend — fetch, process, chunk, embed, and query YouTube transcripts."
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.2.3",
    "youtube-transcript-api>=1.2.4",
    "tiktoken>=0.9.0",
    "google-genai>=2.20.0",
    "langchain-core>=1.6.1",
    "langchain-groq>=1.1.3",
    "qdrant-client>=1.19.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.0.1",
    "sqlalchemy>=2.0.52",
    "psycopg[binary]>=3.3.5",
    "alembic>=1.19.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
