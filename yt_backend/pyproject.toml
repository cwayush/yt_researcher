[project]
name = "yt-backend"
version = "0.1.0"
description = "YouTube Video RAG backend — fetch, process, chunk, embed, and query YouTube transcripts."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.2",
    "faiss-cpu>=1.15.0",
    "fastapi[standard]>=0.141.1",
    "google-genai>=2.20.0",
    "groq>=0.37.1",
    "langchain>=1.3.18",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.1",
    "langchain-google-genai>=4.3.7",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.0",
    "rank-bm25>=0.2.2",
    "sqlalchemy>=2.0.52",
    "tavily-python>=0.8.0",
    "tiktoken>=0.9.0",
    "youtube-transcript-api>=1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
